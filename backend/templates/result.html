<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">

<div class="container">

<div class="card">

{% if hash %}
<h2>✅ Certificate Issued</h2>
<p><b>Hash:</b> {{hash}}</p>
<p><b>Transaction:</b> {{tx}}</p>

<img src="/{{qr}}" width="200">

<br><br>
<a href="/dashboard"><button>Go Back</button></a>
{% endif %}

{% if data %}
<h2>🔍 Verification Result</h2>
<p>Name: {{data[0]}}</p>
<p>Course: {{data[1]}}</p>
<p>Status: {{data[4]}}</p>
{% endif %}

</div>

</div>
