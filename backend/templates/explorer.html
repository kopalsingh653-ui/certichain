<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">

<div class="container">

<h2>Blockchain Explorer</h2>

<div class="card">
  <h3>Recent Transactions</h3>

  {% for tx in txs %}
    <p><b>Hash:</b> {{tx.hash}}</p>
    <p><b>From:</b> {{tx.from}}</p>
    <p><b>To:</b> {{tx.to}}</p>
    <hr>
  {% endfor %}

</div>

</div>
